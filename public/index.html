<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аяла Kids — Админ-панель</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  body{margin:0;background:#FFF7F3;color:#3a2a22;}
  header{background:#D85A30;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:18px;margin:0;}
  header button{background:#fff2;color:#fff;border:1px solid #fff5;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;}
  main{max-width:900px;margin:0 auto;padding:24px;}
  .login-box{max-width:340px;margin:80px auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 24px #0001;}
  .login-box h2{margin-top:0;color:#D85A30;}
  input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid #e6d3c8;border-radius:10px;font-size:14px;margin-top:6px;margin-bottom:14px;}
  button.primary{background:#D85A30;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:700;width:100%;cursor:pointer;font-size:14px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:9px 16px;border-radius:20px;background:#fff;border:1px solid #e6d3c8;cursor:pointer;font-size:13px;font-weight:700;color:#993C1D;}
  .tab.active{background:#D85A30;color:#fff;border-color:#D85A30;}
  .panel{display:none;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 14px #0000000d;}
  .panel.active{display:block;}
  textarea{width:100%;min-height:320px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:12px;border-radius:10px;border:1px solid #e6d3c8;background:#FFFBF9;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .msg{font-size:13px;font-weight:700;margin-top:10px;}
  .msg.ok{color:#1D9E75;}
  .msg.err{color:#c0392b;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f1e4dd;}
  th{color:#993C1D;font-size:12px;text-transform:uppercase;}
  select{padding:6px 8px;border-radius:8px;border:1px solid #e6d3c8;}
  .del{color:#c0392b;cursor:pointer;font-weight:700;font-size:12px;}
</style>
</head>
<body>

<div id="login" class="login-box">
  <h2>Аяла Kids · Админка</h2>
  <label>Пароль администратора</label>
  <input type="password" id="pw" placeholder="Пароль">
  <button class="primary" onclick="login()">Войти</button>
  <div class="msg err" id="loginMsg"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>🎈 Аяла Kids — Админ-панель</h1>
    <button onclick="logout()">Выйти</button>
  </header>
  <main>
    <div class="tabs">
      <div class="tab active" data-tab="leads" onclick="switchTab('leads')">Заявки</div>
      <div class="tab" data-tab="home" onclick="switchTab('home')">Главная</div>
      <div class="tab" data-tab="education" onclick="switchTab('education')">Образование</div>
      <div class="tab" data-tab="parents" onclick="switchTab('parents')">Родителям</div>
      <div class="tab" data-tab="courses" onclick="switchTab('courses')">Кружки</div>
      <div class="tab" data-tab="gallery" onclick="switchTab('gallery')">Галерея</div>
      <div class="tab" data-tab="contacts" onclick="switchTab('contacts')">Контакты</div>
    </div>

    <div class="panel active" id="panel-leads">
      <div class="row"><strong>Заявки родителей</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="loadLeads()">Обновить</button></div>
      <table>
        <thead><tr><th>Дата</th><th>Тип</th><th>Имя</th><th>Телефон</th><th>Сообщение</th><th>Статус</th><th></th></tr></thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>

    <div class="panel" id="panel-home">
      <div class="row"><strong>Раздел: Главная</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('home')">Сохранить</button></div>
      <textarea id="ta-home"></textarea>
      <div class="msg" id="msg-home"></div>
    </div>
    <div class="panel" id="panel-education">
      <div class="row"><strong>Раздел: Образование</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('education')">Сохранить</button></div>
      <textarea id="ta-education"></textarea>
      <div class="msg" id="msg-education"></div>
    </div>
    <div class="panel" id="panel-parents">
      <div class="row"><strong>Раздел: Родителям</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('parents')">Сохранить</button></div>
      <textarea id="ta-parents"></textarea>
      <div class="msg" id="msg-parents"></div>
    </div>
    <div class="panel" id="panel-courses">
      <div class="row"><strong>Раздел: Кружки</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('courses')">Сохранить</button></div>
      <textarea id="ta-courses"></textarea>
      <div class="msg" id="msg-courses"></div>
    </div>
    <div class="panel" id="panel-gallery">
      <div class="row"><strong>Раздел: Галерея</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('gallery')">Сохранить</button></div>
      <textarea id="ta-gallery"></textarea>
      <div class="msg" id="msg-gallery"></div>
    </div>
    <div class="panel" id="panel-contacts">
      <div class="row"><strong>Раздел: Контакты</strong><button class="primary" style="width:auto;padding:8px 14px;" onclick="save('contacts')">Сохранить</button></div>
      <textarea id="ta-contacts"></textarea>
      <div class="msg" id="msg-contacts"></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
